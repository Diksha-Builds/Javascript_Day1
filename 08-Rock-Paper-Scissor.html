<!-- 
    Algorithm :

    When we click a button -
    Step 1 - Computer randomly selects a move
    Step 2 - Compare the moves to get the result
    Step 3 - Update a score
    Step 4 - Display the result and score in a popup

-->


<!DOCTYPE html>
<html>
<head>
    <title>Rock-Paper-Scissors</title>
</head>
<body>
    <p>Rock-Paper-Scissors</p>

    <button onclick="
        playGame('Rock');
    ">Rock</button>

    <button onclick="
        playGame('Paper');
    ">Paper</button>

    <button onclick="
        playGame('Scissors');
    
    ">Scissors</button>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    ">Reset Button
    </button>

    <script>
        let score = JSON.parse(localStorage.getItem('score'))    // It takes out the given value out of the local storage

        if(!score)  // score === null
        {
            score = {
                wins : 0,
                losses : 0,
                ties : 0
            };
        }
        function playGame(playerMove)
        {
            const computerMove = pickComputerMove();

            result = '';

            if(playerMove === 'Scissors')
            {
                if(computerMove === 'Rock')
                {
                    result = 'You lose.';
                }
                else if(computerMove === 'Paper')
                {
                    result = 'You Win.';
                }
                else if(computerMove === 'Scissors')
                {
                    result = 'Tie.';
                }
            } 
            else if(playerMove === 'Paper')
            {
                if(computerMove === 'Rock')
                {
                    result = 'You lose.';
                }
                else if(computerMove === 'Paper')
                {
                    result = 'You Win.';
                }
                else if(computerMove === 'Scissors')
                {
                    result = 'Tie.';
                }
            }
            else if(playerMove === 'Rock')
            {
                if(computerMove === 'Rock')
                {
                    result = 'You lose.';
                }
                else if(computerMove === 'Paper')
                {
                    result = 'You Win.';
                }
                else if(computerMove === 'Scissors')
                {
                    result = 'Tie.';
                }
            }

            if(result === 'You Win.')
            {
                score.wins = score.wins + 1;
            }
            else if(result === 'You Lose.')
            {
                score.losses = score.losses + 1;
            }
            else if(result === 'Tie.')
            {
                score.ties = score.ties + 1;
            }

            // JSON.stringfy() converts the value into a string
            localStorage.setItem('score', JSON.stringify(score));   // when you storage anything inside the localStorage, it doesnt disappear after refreshing the page

            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses : ${score.losses}, Ties : ${score.ties}`);
        }

        function pickComputerMove()
        {
            const randomNumber = Math.random(); 
            let computerMove = '';

            if(randomNumber >= 0 && randomNumber < 1/3)
            {
                computerMove = 'Rock';
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3)
            {
                computerMove = 'Paper';
            }
            else if(randomNumber >= 2/3 && randomNumber < 1)
            {
                computerMove = 'Scissors';
            }

            return computerMove; 
            console.log('return'); // doesnt run because return returns the function 
        }
    </script>
</body>
</html>
