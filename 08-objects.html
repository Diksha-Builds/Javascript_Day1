        console.log('hello'.length);
        console.log('hello'.toUpperCase);

        const object1 = {   // reference
            message : 'hello'
        };

        const object2 = object1;    // copy by reference

        object1.message = 'Good Job!';
        console.log(object1);   // even though the object is const, the message gets changed because its just a reference and reference doesnt stop you from making changes inside the {} 
        console.log(object2);

        const object3 = {
            message : 'Good Job!'
        };

        console.log(object3 === object2); // false -> compares the references, not the values inside

        console.log(object2 === object1); // true -> because they have the same reference

        const object4 = {
            message : 'Good Job!',
            price : 799
        };

        const {message, price} = object4;
