<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <script>
        let hour = 20;

        if(hour >= 6 && hour < 12)
        {
            console.log('Good Morning!');
        }
        else if(hour >= 12 && hour < 17)
        {
            console.log('Good Afternoon!');
        }
        else if(hour >= 17 && hour < 24)
        {
            console.log('Good Night!');
        }
    </script>
</body>
</html>
