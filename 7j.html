<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('2');
      ">3</button>

      <button onclick="
        updateCalculation('2');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('2');
      ">4</button>

      <button onclick="
        updateCalculation('2');
      ">5</button>

      <button onclick="
        updateCalculation('2');
      ">6</button>

      <button onclick="
        updateCalculation('2');
      ">-</button>
    </p>

    <p>
      <button onclick="
        calculation += '7';
        console.log(calculation);
      ">7</button>

      <button onclick="
        updateCalculation('2');
      ">8</button>

      <button onclick="
        updateCalculation('2');
      ">9</button>

      <button onclick="
        updateCalculation('2');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('2');
      ">0</button>

      <button onclick="
        updateCalculation('2');
      ">.</button>

      <button onclick="
        calculation = eval(calculation);
        console.log(calculation);
      ">=</button>

      <button onclick="
        updateCalculation('2');
      ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        console.log('Cleared.');
      ">Clear</button>
    </p>

    <script>
      let calculation = '';

      function updateCalculation(value)
      {
          calculation += value;
          console.log(calculation);
      }
    </script>
  </body>
</html>
