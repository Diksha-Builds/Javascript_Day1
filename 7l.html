<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <button onclick="
        console.log(`Cart Quantity : ${cartQuantity}`);
        ">Show Quantity</button>

    <button onclick="
        updateCartQuantity(1);
    ">Add to cart</button>

    <button onclick="
        updateCartQuantity(2);
    ">+2</button>

    <button onclick="
        updateCartQuantity(3);
    ">+3</button>

    <button onclick="
        updateCartQuantity(4);
    ">+4</button>

    <button onclick="
        updateCartQuantity(5);
    ">+5</button>

    <button onclick="
        updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
        updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
        updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
        cartQuantity = 0;
        console.log('Cart was reset');
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">Reset cart</button>

    <script>
        let cartQuantity = 0;

        function updateCartQuantity(change)
        {
            if(cartQuantity + change > 10)
            {
                console.log("Cart quantity is full");
                return;
            }
            else if(cartQuantity + change < 0)
            {
                console.log("Not enough items in the cart");
                return;
            }
            else
            {
                cartQuantity += change;
                console.log(`Cart Quantity : ${cartQuantity}`);
            }
        }
    </script>
</body>
</html>
