<html lang="en">

    <title>Document</title>
</head>
<body>
    <script>
        const product1 = {
            name : 'Pen',
            price : 100
        };

        const product2 = {
            name : 'Book',
            price : 500
        };

        const product3 = {
            name : 'Pen',
            price : 100
        };

        function isSameProduct(pro1, pro2)
        {
            if(pro1.name === pro2.name && pro1.price === pro2.price)
            {
                return true;
            }
            else
            {
                return false;
            }
        }

        console.log(isSameProduct(product1, product2));
        console.log(isSameProduct(product1, product3));
    </script>
</body>
