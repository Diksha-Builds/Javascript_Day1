<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <button onclick="playGame('Heads')
    ">Heads</button>

    <button onclick="playGame('Tails')
    ">Tails</button>

    <script>
        let score = {
            wins : 0,
            losses : 0
        };

        function playGame(guess)
        {
            const randomNumber = Math.random();

            const result = randomNumber < 0.5 ? 'Heads' : 'Tails';

            console.log(guess === result ? 'You Win.' : 'You Lose.');

            if(guess === result)
            {
                score.wins++;
            }
            else
            {
                score.losses++;
            }
            console.log(score);
        }

    </script>
</body>
</html>
