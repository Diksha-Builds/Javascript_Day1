<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <button onclick="document.getElementById('paragraph').innerHTML = 'Your cart items are : '+ cartquantity;" >Show Quantity</button>
        <button onclick="cartquantity = cartquantity +1">Add to cart</button>
        <button onclick="cartquantity = cartquantity +2">+2</button>
        <button onclick="cartquantity = cartquantity +3">+3</button>
        <button onclick="cartquantity = 0">Clear cart</button>

        <p id = "paragraph"></p>
        <script>
            let cartquantity = 0;
        </script>
</body>
</html>
